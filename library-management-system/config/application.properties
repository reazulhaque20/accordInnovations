server.port=8181
server.servlet.context-path=/library

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.file.name=logs/library-management.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.library=DEBUG
logging.level.org.springframework.web=INFO

# External API Configuration
external.api.google-books.url=https://www.googleapis.com/books/v1/volumes
external.api.timeout=5000

# Application Info
app.name=Library Management System
app.version=1.0.0
app.description=Spring Boot 3 Library Management Application